        // 1
        // 12
        // 123
        // 1234
        // 12345
        for (let j = 1; j <= 5; j++) {
            for (let i = 1; i <= j; i++) {
                document.write(i);
            }
            document.write("<br/>")
        }
    </script>
    <script>
        // 5
        // 54
        // 543
        // 5432
        // 54321 
        for (let j = 5; j >= 1; j--) {
            for (let i = 5; i >= j; i--) {
                document.write(i);
            }
            document.write("<br/>")
        }
    </script>
