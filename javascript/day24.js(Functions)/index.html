<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function add() {
        var num1 = parseInt(document.getElementById("n1").value);
        var num2 = parseInt(document.getElementById("n2").value);
        var result = num1 + num2;
        document.getElementById("res").value = result;
      }
      function mul() {
        var num1 = parseInt(document.getElementById("n1").value);
        var num2 = parseInt(document.getElementById("n2").value);
        var result = num1 * num2;
        document.getElementById("res").value = result;
      }
      function sub() {
        var num1 = parseInt(document.getElementById("n1").value);
        var num2 = parseInt(document.getElementById("n2").value);
        var result = num1 - num2;
        document.getElementById("res").value = result;
      }
      function div() {
        var num1 = parseInt(document.getElementById("n1").value);
        var num2 = parseInt(document.getElementById("n2").value);
        var result = num1 / num2;
        document.getElementById("res").value = result;
      }
      function mod() {
        var num1 = parseInt(document.getElementById("n1").value);
        var num2 = parseInt(document.getElementById("n2").value);
        var result = num1 % num2;
        document.getElementById("res").value = result;
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #e8edf5;
      }

      .calculator {
        width: 380px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #2c3e50;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-bottom: 18px;
        border: 1px solid #bbb;
        border-radius: 6px;
        font-size: 16px;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      button {
        width: 100px;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #a0bdd0;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #9bbed5;
      }

      #res {
        background: #f4f4f4;
        font-weight: bold;
      }
    </style>    
  </head>
  <body>
    <body>
      <div class="calculator">
        <h2>Calculator</h2>
        <label>Enter First Number</label>
        <input type="text" id="n1" />
        <label>Enter Second Number</label>
        <input type="text" id="n2" />
        <div class="buttons">
          <button onclick="add()">Add</button>
          <button onclick="sub()">Sub</button>
          <button onclick="mul()">Multiply</button>
          <button onclick="div()">Divide</button>
          <button onclick="mod()">Modulus</button>
        </div>
        <label>Result</label>
        <input type="text" id="res" readonly />
      </div>
    </body>
  </body>
</html>
